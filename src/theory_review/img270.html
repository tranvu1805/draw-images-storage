<div style="font-size:24px">$\mathrm{I}=\mathop{\Large\int}\limits_1^3\dfrac{2\mathrm{x}-1}{\mathrm{x}+1}\mathrm{dx}=\mathop{\Large\int}\limits_1^3\left(2-\dfrac{3}{\mathrm{x}+1}\right)\mathrm{dx}=\Big[2\mathrm{x}-3\ln\left(\mathrm{x}+1\right)\Big]\Big|_1^3=6-3\ln4-2+3\ln2=4-3\ln2$ .</div>
