<div style="font-size:20px;line-height:1.2"><div>Ta có: $S=\mathop{\Large\int}\limits_1^2\left|(x-2)^2-1\right|dx=\mathop{\Large\int}\limits_1^2\left|x^2-4x+3\right|dx$</div>
<div style="margin-top:28px">Có $(x-2)^2-1<0,\forall x\in[1;2]$ nên $S=\mathop{\Large\int}\limits_1^2\left(-x^2+4x-3\right)dx=\left.\left(-\dfrac{x^3}{3}+2x^2-3x\right)\right|_1^2=\dfrac{2}{3}.$</div></div>
